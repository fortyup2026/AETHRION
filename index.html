<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CETRIOS — Mapa Interactivo V3</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold2:#f1d889;--gold3:#755518;--dark:#050302;
  --line:rgba(201,168,76,.26);--green:#68b295;--red:#d63e3e;
  --inv:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#030201;color:var(--gold2);font-family:'Crimson Text',serif}
button{font-family:inherit}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(80,55,18,.12),transparent 40%),#030201;overflow:hidden}
#map-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:linear-gradient(180deg,#050302,#010101)}
#map-wrap.dragging{cursor:grabbing}
#map-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#map-img{display:block;width:900px;height:auto;user-select:none;-webkit-user-drag:none;filter:saturate(1.05) contrast(1.04) brightness(.88);box-shadow:0 0 80px rgba(0,0,0,.8)}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 48%,rgba(0,0,0,.72) 100%);z-index:4;transition:opacity .4s}
.dim #vignette{opacity:.45}

/* ---------- HUD ---------- */
#hud{position:fixed;z-index:20;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;pointer-events:none;transition:opacity .35s,transform .35s}
.hud-hide{opacity:0;transform:translateY(-12px)}
.hud-copy{max-width:min(420px,70vw);text-shadow:0 2px 18px #000}
.hud-kicker{font-family:'Cinzel',serif;font-size:11px;letter-spacing:8px;color:var(--gold);text-transform:uppercase;opacity:.8}
.hud-title{font-family:'Cinzel',serif;font-size:clamp(36px,7vw,76px);line-height:.9;font-weight:900;color:var(--gold2);text-shadow:0 0 28px rgba(201,168,76,.25)}
.hud-sub{font-size:clamp(14px,2.8vw,20px);color:#c9a974;font-style:italic;line-height:1.35;margin-top:8px;max-width:520px}
.hud-hint{margin-top:14px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:var(--gold3);text-transform:uppercase}

/* ---------- MARCADORES (escala inversa: no crecen con el zoom) ---------- */
.hotspot{
  position:absolute;z-index:10;border:0;background:transparent;cursor:pointer;
  transform:translate(-50%,-50%) scale(var(--inv));
  transform-origin:50% 50%;
  transition:filter .2s;
}
.spot-hit{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%}
.mark{position:relative;width:15px;height:15px;display:block}
.mark i{
  position:absolute;inset:0;transform:rotate(45deg);
  background:linear-gradient(140deg,#fff3c4,var(--gold) 55%,#8a6a22);
  border:1px solid rgba(255,240,190,.85);
  box-shadow:0 0 9px rgba(201,168,76,.75),0 2px 6px rgba(0,0,0,.9);
}
.mark s{
  position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
  border:1px solid rgba(201,168,76,.45);border-radius:50%;
  animation:pulse 3.2s ease-in-out infinite;
}
.hotspot.capital .mark{width:20px;height:20px}
.hotspot.capital .mark i{background:linear-gradient(140deg,#fff8dd,#ffe08a 50%,var(--gold));box-shadow:0 0 16px rgba(255,224,138,.85),0 0 34px rgba(201,168,76,.5)}
.hotspot.region .mark i{background:linear-gradient(140deg,#d8ffe9,#5fa682 60%,#2f5f49);border-color:rgba(200,255,225,.7);box-shadow:0 0 9px rgba(104,178,149,.7),0 2px 6px rgba(0,0,0,.9)}
.hotspot.region .mark s{border-color:rgba(104,178,149,.4)}
.hotspot.danger .mark i{background:linear-gradient(140deg,#ffb0b0,#c61e1e 60%,#6d0f0f);border-color:rgba(255,190,190,.7);box-shadow:0 0 9px rgba(214,62,62,.75),0 2px 6px rgba(0,0,0,.9)}
.hotspot.danger .mark s{border-color:rgba(214,62,62,.38)}
.hotspot:active{filter:brightness(1.4)}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.15}50%{transform:scale(1.05);opacity:.5}}

.spot-label{
  position:absolute;left:50%;top:15px;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:1.25px;text-transform:uppercase;
  color:#f4e3ac;white-space:nowrap;padding:6px 10px;border-radius:7px;
  background:rgba(4,3,1,.72);border:1px solid rgba(201,168,76,.28);
  text-shadow:0 2px 6px #000;opacity:0;transition:opacity .25s;pointer-events:none;
}
.show-labels .spot-label{opacity:1}
.hotspot.capital .spot-label{opacity:1;font-size:14px;color:#fff1bd;border-color:rgba(201,168,76,.5)}
.hotspot.active .mark i{box-shadow:0 0 20px #fff0aa,0 0 44px rgba(201,168,76,.8)}

/* ---------- PANEL ---------- */
#panel{
  position:fixed;z-index:80;right:16px;top:16px;bottom:16px;width:min(400px,calc(100vw - 32px));
  background:linear-gradient(160deg,rgba(12,9,4,.97),rgba(4,3,2,.97));
  border:1px solid var(--gold3);box-shadow:0 24px 80px rgba(0,0,0,.85);
  transform:translateX(calc(100% + 28px));transition:transform .42s cubic-bezier(.2,.85,.2,1);
  overflow:hidden;display:flex;flex-direction:column
}
.panel-open{transform:translateX(0)!important}

/* imagen del lugar */
#p-hero{
  position:relative;height:190px;flex:0 0 auto;
  background-color:#0a0704;background-repeat:no-repeat;
  border-bottom:1px solid rgba(201,168,76,.22);
  transform:scale(1.06);opacity:0;transition:transform .7s cubic-bezier(.2,.85,.2,1),opacity .5s
}
.panel-open #p-hero{transform:scale(1);opacity:1}
#p-hero:after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(3,2,1,.15) 0%,rgba(3,2,1,.55) 55%,rgba(6,4,2,.97) 100%),
             radial-gradient(circle at 50% 45%,transparent 30%,rgba(0,0,0,.45) 100%)
}
.hero-caption{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 24px 14px
}
.panel-type{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:7px;text-shadow:0 2px 10px #000}
.panel-name{font-family:'Cinzel',serif;font-size:29px;font-weight:900;color:var(--gold2);line-height:1;text-shadow:0 3px 22px #000,0 0 30px rgba(201,168,76,.3)}
.panel-close{position:absolute;right:14px;top:14px;z-index:5;width:38px;height:38px;background:rgba(5,3,1,.6);border:1px solid var(--gold3);color:var(--gold2);font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.panel-body{padding:22px 24px 34px;overflow:auto;flex:1 1 auto}
.sec{margin-bottom:22px}
.sec-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold3);padding-bottom:7px;border-bottom:1px solid rgba(201,168,76,.15);margin-bottom:10px}
.sec p{font-size:15px;color:#b89d5e;line-height:1.65}
.sec em{color:var(--gold2);font-style:normal}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid rgba(201,168,76,.13);background:rgba(201,168,76,.045);padding:10px}
.stat small{display:block;font-family:'Cinzel',serif;color:var(--gold3);font-size:8px;letter-spacing:2px;text-transform:uppercase}
.stat b{display:block;margin-top:4px;color:var(--gold2);font-size:13px}
.quote{border-left:2px solid var(--gold3);background:rgba(201,168,76,.035);padding:11px 14px;color:#927941;font-style:italic;line-height:1.55}
.place{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid rgba(201,168,76,.08);color:#d0b26c}
.place:before{content:'◆';font-size:10px;color:var(--gold3)}
.districts{display:grid;grid-template-columns:1fr;gap:9px}
.district{background:rgba(201,168,76,.045);border:1px solid rgba(201,168,76,.14);padding:11px 12px}
.district b{font-family:'Cinzel',serif;color:var(--gold2);font-size:13px}
.district span{display:block;color:#9d854d;font-size:13px;line-height:1.35;margin-top:3px}
.p-nav{display:flex;gap:8px;margin-top:6px}
.p-nav button{flex:1;padding:11px 8px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.22);color:var(--gold2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.p-nav button:active{background:rgba(201,168,76,.2)}

/* ---------- VISTA CINEMÁTICA DEL LUGAR ---------- */
#scene{
  position:fixed;inset:0;z-index:70;overflow:hidden;background:#050403;
  opacity:0;pointer-events:none;transition:opacity .34s ease;
}
#scene.open{opacity:1;pointer-events:auto}
#scene-bg,#scene-mid,#scene-front,#scene-fx{position:absolute;inset:-3%;will-change:transform,opacity}
#scene-bg{background-position:center;background-size:cover;transform:scale(1.04);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
#scene.open #scene-bg{transform:scale(1)}
#scene-mid,#scene-front{pointer-events:none}
#scene-fx{pointer-events:none;background:linear-gradient(180deg,rgba(4,3,2,.12),rgba(4,3,2,.08) 44%,rgba(4,3,2,.72));box-shadow:inset 0 0 180px #000}
#scene-fx:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 54% 38%,transparent 0 30%,rgba(0,0,0,.28) 76%,rgba(0,0,0,.65));}
#scene-fx:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-6%;height:42%;background:linear-gradient(180deg,transparent,rgba(3,2,1,.92));filter:blur(10px)}
.scene-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.scene-particles i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(241,216,137,.4);box-shadow:0 0 12px rgba(241,216,137,.35);animation:floatDust var(--d,9s) linear infinite;opacity:.25}
@keyframes floatDust{from{transform:translate3d(0,25vh,0)}to{transform:translate3d(var(--x,30px),-115vh,0)}}
.scene-top{position:absolute;z-index:5;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.scene-back{border:1px solid rgba(241,216,137,.42);background:rgba(5,4,2,.62);color:#f6e6b7;padding:11px 14px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;backdrop-filter:blur(10px);cursor:pointer;border-radius:9px}
.scene-card{position:absolute;z-index:6;left:max(20px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:min(680px,calc(100vw - 40px));padding:24px 26px;background:linear-gradient(110deg,rgba(6,4,2,.84),rgba(6,4,2,.48));border:1px solid rgba(201,168,76,.34);backdrop-filter:blur(16px);box-shadow:0 20px 70px rgba(0,0,0,.55);border-radius:16px}
.scene-type{font-family:'Cinzel',serif;font-size:11px;letter-spacing:5px;color:#c9a84c;text-transform:uppercase}
.scene-name{font-family:'Cinzel',serif;font-size:clamp(34px,6vw,72px);line-height:.92;font-weight:900;color:#f5df9c;margin-top:5px;text-shadow:0 5px 28px #000}
.scene-short{font-size:clamp(17px,2.1vw,23px);line-height:1.42;color:#ddc78b;margin-top:12px;max-width:620px}
.scene-enter{margin-top:17px;border:1px solid rgba(241,216,137,.5);background:rgba(201,168,76,.12);color:#f5df9c;padding:12px 15px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:8px}
.scene-enter:hover{background:rgba(201,168,76,.22)}
/* siluetas y profundidad */
#scene-mid:before,#scene-front:before,#scene-front:after{content:'';position:absolute;left:-5%;right:-5%;bottom:-2%;transform-origin:bottom}
.scene-forest #scene-mid:before{height:50%;background:repeating-linear-gradient(95deg,transparent 0 4%,rgba(6,10,7,.75) 4.5% 5.3%,transparent 5.8% 9%);clip-path:polygon(0 70%,4% 45%,7% 67%,11% 28%,15% 66%,19% 36%,23% 73%,29% 22%,35% 68%,42% 34%,48% 77%,54% 30%,61% 69%,67% 18%,73% 69%,80% 35%,87% 68%,93% 28%,100% 72%,100% 100%,0 100%);filter:blur(.2px)}
.scene-forest #scene-front:before{height:36%;background:rgba(2,5,3,.96);clip-path:polygon(0 75%,7% 58%,13% 72%,20% 45%,28% 75%,36% 50%,44% 74%,53% 44%,62% 76%,70% 48%,78% 72%,86% 52%,93% 70%,100% 54%,100% 100%,0 100%)}
.scene-city #scene-mid:before{height:48%;background:linear-gradient(90deg,#0b0907,#15100b 55%,#090706);clip-path:polygon(0 72%,4% 72%,4% 44%,10% 44%,10% 66%,14% 66%,14% 28%,20% 28%,20% 70%,24% 70%,24% 48%,29% 48%,29% 18%,34% 18%,34% 64%,40% 64%,40% 36%,45% 36%,45% 72%,51% 72%,51% 24%,58% 24%,58% 62%,63% 62%,63% 40%,69% 40%,69% 67%,75% 67%,75% 30%,81% 30%,81% 72%,86% 72%,86% 52%,91% 52%,91% 69%,96% 69%,96% 38%,100% 38%,100% 100%,0 100%)}
.scene-city #scene-front:before{height:25%;background:#030201;clip-path:polygon(0 68%,10% 48%,19% 65%,29% 42%,42% 65%,53% 47%,66% 69%,79% 43%,90% 64%,100% 50%,100% 100%,0 100%)}
.scene-desert #scene-mid:before{height:40%;background:linear-gradient(180deg,#8b5c2c,#2e190b);clip-path:polygon(0 60%,9% 44%,18% 62%,31% 37%,43% 65%,58% 36%,72% 62%,86% 41%,100% 60%,100% 100%,0 100%)}
.scene-desert #scene-front:before{height:28%;background:#1b0e06;clip-path:polygon(0 62%,18% 45%,38% 66%,58% 48%,78% 70%,100% 50%,100% 100%,0 100%)}
.scene-ice #scene-mid:before{height:52%;background:linear-gradient(180deg,#dce8e9,#49606c);clip-path:polygon(0 79%,8% 48%,15% 72%,25% 28%,34% 68%,45% 16%,54% 67%,64% 34%,73% 72%,84% 24%,92% 62%,100% 36%,100% 100%,0 100%)}
.scene-ice #scene-front:before{height:25%;background:#0c1115;clip-path:polygon(0 62%,14% 46%,28% 66%,42% 44%,57% 69%,75% 45%,89% 67%,100% 55%,100% 100%,0 100%)}
.scene-sea #scene-mid:before{height:32%;background:linear-gradient(180deg,rgba(32,66,79,.25),#0e2630 45%,#061116);clip-path:polygon(0 48%,8% 60%,16% 50%,24% 64%,32% 48%,40% 61%,48% 49%,56% 63%,64% 48%,72% 60%,80% 49%,88% 62%,96% 50%,100% 54%,100% 100%,0 100%)}
.scene-sea #scene-front:before{height:20%;background:#02080b;clip-path:polygon(0 56%,16% 42%,32% 58%,49% 44%,65% 60%,82% 46%,100% 58%,100% 100%,0 100%)}

/* V3: las panorámicas ya no usan siluetas geométricas CSS. El paisaje completo
   se dibuja como una ilustración SVG única por territorio. */
#scene-mid,#scene-front{display:none!important}
#scene-bg{inset:0;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important}
#scene-fx{inset:0;background:linear-gradient(180deg,rgba(3,3,3,.04),rgba(3,3,3,.02) 48%,rgba(3,2,1,.62));box-shadow:inset 0 0 120px rgba(0,0,0,.45)}
#scene-fx:before{background:radial-gradient(circle at 52% 38%,transparent 0 42%,rgba(0,0,0,.12) 75%,rgba(0,0,0,.38))}
#scene-fx:after{height:24%;opacity:.62}
.scene-card{background:linear-gradient(110deg,rgba(6,4,2,.78),rgba(6,4,2,.48));border-color:rgba(236,208,128,.38)}
@media(max-width:720px){
  .scene-card{padding:18px 18px;bottom:14px;width:calc(100vw - 28px);left:14px}
  .scene-name{font-size:clamp(34px,10vw,48px)}
  .scene-short{font-size:16px}
  .scene-enter{width:100%}
  .spot-label{font-size:12px!important;padding:6px 8px;letter-spacing:1.3px}
}


/* ---------- CONTROLES ---------- */
#controls{position:fixed;z-index:30;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.ctrl{width:46px;height:46px;background:rgba(6,4,2,.82);border:1px solid var(--gold3);color:var(--gold2);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.ctrl:active{background:rgba(201,168,76,.22)}
#right-actions{position:fixed;z-index:30;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.round{width:50px;height:50px;border-radius:50%;border:1px solid var(--gold3);background:rgba(6,4,2,.84);color:var(--gold2);font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.55);backdrop-filter:blur(12px)}
.round.active{background:radial-gradient(circle,rgba(201,168,76,.32),rgba(6,4,2,.9));box-shadow:0 0 24px rgba(201,168,76,.28)}
#legend{position:fixed;z-index:45;right:max(78px,calc(env(safe-area-inset-right) + 78px));bottom:max(18px,env(safe-area-inset-bottom));width:min(290px,calc(100vw - 112px));background:rgba(7,5,2,.94);border:1px solid var(--gold3);box-shadow:0 20px 60px rgba(0,0,0,.75);padding:15px 17px;backdrop-filter:blur(15px);transform:translateY(15px) scale(.98);opacity:0;pointer-events:none;transition:.22s}
.legend-open{opacity:1!important;transform:translateY(0) scale(1)!important;pointer-events:auto!important}
.legend-title{font-family:'Cinzel',serif;color:var(--gold2);font-size:11px;letter-spacing:4px;margin-bottom:12px}
.legend-row{display:flex;align-items:center;gap:11px;font-family:'Cinzel',serif;color:#a58a50;font-size:11px;letter-spacing:1.5px;margin:9px 0}
.ld{width:12px;height:12px;flex:0 0 auto;transform:rotate(45deg)}
.ld.cap{background:linear-gradient(140deg,#fff8dd,var(--gold))}
.ld.city{background:linear-gradient(140deg,#fff3c4,var(--gold) 55%,#8a6a22)}
.ld.reg{background:linear-gradient(140deg,#d8ffe9,#5fa682)}
.ld.dan{background:linear-gradient(140deg,#ffb0b0,#c61e1e)}
#loading{position:fixed;z-index:999;inset:0;background:#030201;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s}
.loading-done{opacity:0;pointer-events:none}
.load-title{font-family:'Cinzel',serif;font-size:clamp(42px,10vw,72px);letter-spacing:14px;color:var(--gold);text-shadow:0 0 45px rgba(201,168,76,.35)}
.load-sub{font-style:italic;color:#927941}
.loadbar{width:min(320px,70vw);height:2px;background:rgba(201,168,76,.12);overflow:hidden}
.loadbar:after{content:'';display:block;width:55%;height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1.4s infinite}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(220%)}}

@media(max-width:720px){
  #hud{top:14px;left:14px;right:14px}
  .hud-copy{max-width:78vw}.hud-kicker{font-size:9px;letter-spacing:5px}
  .hud-title{font-size:42px}.hud-sub{font-size:15px;max-width:280px}
  #panel{left:0;right:0;top:auto;bottom:0;width:100%;height:74vh;border-left:0;border-right:0;border-bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%)}
  .panel-open{transform:translateY(0)!important}
  #p-hero{height:168px;border-radius:20px 20px 0 0}
  .panel-name{font-size:25px}
  .panel-body{padding:18px 22px 40px}
  .stats{grid-template-columns:1fr}
  .ctrl{width:42px;height:42px}.round{width:48px;height:48px}
  #legend{right:76px;bottom:18px;width:calc(100vw - 106px)}
  .spot-label{font-size:11.5px;padding:5px 8px}
}
@media(max-height:560px){#panel{height:88vh}.hud-sub{display:none}.hud-title{font-size:34px}}
@media (prefers-reduced-motion:reduce){#p-hero{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="loading"><div class="load-title">CETRIOS</div><div class="load-sub">Abriendo los caminos de Cetrios...</div><div class="loadbar"></div></div>

  <div id="hud"><div class="hud-copy">
    <div class="hud-kicker">Mapa del Mundo</div>
    <div class="hud-title">CETRIOS</div>
    <div class="hud-sub">Un mundo de reinos antiguos, donde los Ecos despiertan entre montañas y mares.</div>
    <div class="hud-hint">Tocá un punto para viajar</div>
  </div></div>

  <div id="map-wrap"><div id="map-stage"><img id="map-img" src="map.png" alt="Mapa de Cetrios" draggable="false"></div></div>
  <div id="vignette"></div>

  <section id="scene" aria-hidden="true">
    <div id="scene-bg"></div><div id="scene-mid"></div><div id="scene-front"></div><div id="scene-fx"></div>
    <div class="scene-particles" id="scene-particles"></div>
    <div class="scene-top"><button class="scene-back" onclick="leaveScene()">← Volver al mapa</button></div>
    <div class="scene-card"><div class="scene-type" id="scene-type"></div><div class="scene-name" id="scene-name"></div><div class="scene-short" id="scene-short"></div><button class="scene-enter" onclick="openCurrentPanel()">Explorar este lugar</button></div>
  </section>

  <aside id="panel">
    <button class="panel-close" onclick="closePanel()" aria-label="Cerrar">×</button>

const locations=[
{id:'aethrion',scene:'city',sceneBg:'radial-gradient(circle at 55% 28%,rgba(241,216,137,.34),transparent 18%),linear-gradient(180deg,#6b5b43 0%,#2d251c 42%,#090705 100%)',x:50,y:44,type:'capital',label:'Capital',name:'Aethrion',short:'El corazón palpitante de Cetrios.',stats:{Población:'~800.000',Clima:'Templado',Importancia:'Reino central'},desc:`<em>Aethrion</em> es la capital de Cetrios: una ciudad circular amurallada, construida alrededor del Palacio Negro. Sus anillos interiores concentran mercados, templos del Eco, pasajes nobles y rutas ocultas que bajan hacia antiguos túneles.`,lore:`“Quien domina Aethrion no domina solamente un palacio. Domina el símbolo que todos los reinos miran antes de decidir si obedecen o se rebelan.”`,places:['Palacio Negro','Mercado de los Siete Velos','Murallas internas','Canales y puentes','Catacumbas antiguas'],districts:[['Palacio Negro','Centro político y ceremonial. Allí están el Salón Blanco, el Salón Rojo y el trono real.'],['Anillo del Mercado','Calles densas, puestos, mercaderes, viajeros, rumores y portadores del Eco.'],['Muralla Interior','Primer gran límite de la ciudad-palacio, con puertas custodiadas y pasos de control.'],['Canales del Primer Anillo','Agua alrededor de la zona central, con puentes ceremoniales y accesos vigilados.'],['Túneles antiguos','Rutas subterráneas usadas como escape, contrabando y secretos del reino.']]},
{id:'velmor',scene:'ice',sceneBg:'radial-gradient(circle at 60% 22%,rgba(219,238,241,.42),transparent 20%),linear-gradient(180deg,#6f8791 0%,#31414a 43%,#080d10 100%)',x:34,y:24,type:'city',label:'Reino',name:'Velmor',short:'El reino frío de las montañas del norte.',stats:{Clima:'Glacial',Carácter:'Aislado'},desc:`<em>Velmor</em> es un reino de piedra, bosque y frío. Sus torres oscuras emergen entre montañas y árboles antiguos.`,lore:`“En Velmor, el viento recuerda mejor que los libros.”`,places:['Fortaleza de Velmor','Puesto de Hielo','Rutas del Norte']},
{id:'darvanis',scene:'city',sceneBg:'radial-gradient(circle at 42% 25%,rgba(224,170,82,.25),transparent 22%),linear-gradient(180deg,#5f4a35 0%,#2b2017 44%,#080604 100%)',x:21,y:52,type:'city',label:'Ciudad-Estado',name:'Darvanis',short:'Ciudad de mercaderes, pactos y secretos.',stats:{Comercio:'Muy alto',Influencia:'Subterránea'},desc:`<em>Darvanis</em> compra lo que no puede conquistar y vende lo que otros temen preguntar.`,lore:`“Si un secreto tiene precio, Darvanis ya lo tasó.”`,places:['Mercado negro','Torre de gremios','Rutas de contrabando']},

{id:'tierras-heladas',scene:'ice',sceneBg:'radial-gradient(circle at 50% 20%,rgba(241,250,255,.5),transparent 19%),linear-gradient(180deg,#9fb2bb 0%,#50636f 46%,#0b1116 100%)',x:50,y:6,type:'danger',label:'Zona peligrosa',name:'Tierras Heladas',short:'Más allá del norte, pocos regresan.',stats:{Peligro:'Extremo',Clima:'Letal'},desc:`Las <em>Tierras Heladas</em> son el límite del mundo conocido. Allí el mapa deja de prometer respuestas.`,lore:`“El norte no mata rápido. Primero te convence de quedarte.”`,places:['Montañas blancas','Rutas perdidas','Ciudad de cristal — leyenda']},

{id:'valle-arden',scene:'forest',sceneBg:'radial-gradient(circle at 45% 24%,rgba(219,208,126,.28),transparent 20%),linear-gradient(180deg,#718063 0%,#334832 46%,#0a120b 100%)',x:50,y:68,type:'region',label:'Valle',name:'Valle de Arden',short:'Refugio, reconstrucción y tierra fértil.',stats:{Clima:'Templado',Importancia:'Refugio'},desc:`El <em>Valle de Arden</em> es fértil, protegido y disputado. Allí algunos encuentran libertad lejos del peso de Aethrion.`,lore:`“Arden no promete salvarte. Solo te da espacio para volver a levantarte.”`,places:['Liedor','Cicus','Refugios antiguos']},

const stage=document.getElementById('map-stage'),img=document.getElementById('map-img'),
      wrap=document.getElementById('map-wrap'),panel=document.getElementById('panel'),
      hero=document.getElementById('p-hero'),hud=document.getElementById('hud'),app=document.getElementById('app');
const scene=document.getElementById('scene'),sceneBg=document.getElementById('scene-bg');

let mapW=900,mapH=1100,scale=1,posX=0,posY=0,minScale=.35,maxScale=5;
let drag=false,dragged=false,startX=0,startY=0,lastDist=0,anim=null,current=null;

/* ---------- transformación ---------- */
function apply(){
  stage.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
  stage.style.setProperty('--inv',1/scale);
  stage.classList.toggle('show-labels',scale>1.05);
}
function clamp(){
  const w=mapW*scale,h=mapH*scale,m=Math.min(innerWidth,innerHeight)*.35;
  posX=Math.min(m,Math.max(innerWidth-w-m,posX));
  posY=Math.min(m,Math.max(innerHeight-h-m,posY));
  if(w+m*2<innerWidth)posX=(innerWidth-w)/2;
  if(h+m*2<innerHeight)posY=(innerHeight-h)/2;
}

/* ---------- animación suave ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animateTo(ts,tx,ty,dur=760,done){
  if(anim)cancelAnimationFrame(anim);
  const s0=scale,x0=posX,y0=posY,t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){scale=ts;posX=tx;posY=ty;clamp();apply();done&&done();return}
  (function step(now){
    const k=Math.min(1,(now-t0)/dur),e=ease(k);
    scale=s0+(ts-s0)*e;posX=x0+(tx-x0)*e;posY=y0+(ty-y0)*e;
    apply();
    if(k<1)anim=requestAnimationFrame(step); else {clamp();apply();done&&done()}
  })(t0);
}

/* ---------- viajar a un lugar ---------- */
function focusLocation(loc,openAfter=true){
  const mobile=innerWidth<720;
  const target=Math.min(maxScale, mobile?3.25:2.65);
  const x=loc.x/100*mapW, y=loc.y/100*mapH;
  /* en celular el panel ocupa abajo: dejamos el punto arriba */
  const anchorY = openAfter ? (mobile?innerHeight*.15:innerHeight*.42) : innerHeight*.5;
  const anchorX = openAfter && !mobile ? (innerWidth-Math.min(400,innerWidth-32))/2 : innerWidth/2;
  const tx=anchorX-x*target, ty=anchorY-y*target;
  app.classList.add('dim');
  hud.classList.add('hud-hide');
  document.querySelectorAll('.hotspot').forEach(h=>h.classList.toggle('active',h.dataset.id===loc.id));
  animateTo(target,tx,ty,560,()=>{ if(openAfter) enterScene(loc) });
}

/* ---------- marcadores ---------- */
function addSpot(loc){
  const x=loc.x/100*mapW,y=loc.y/100*mapH;
  const b=document.createElement('button');
  b.className='hotspot '+loc.type;
  b.dataset.id=loc.id;
  b.style.left=x+'px';b.style.top=y+'px';
  b.setAttribute('aria-label',loc.name);
  b.innerHTML='<span class="spot-hit"></span><span class="mark"><s></s><i></i></span><span class="spot-label">'+loc.name+'</span>';
  b.addEventListener('click',e=>{e.stopPropagation();focusLocation(loc)});
  stage.appendChild(b);
}

/* ---------- entrada cinemática al lugar ---------- */
function buildParticles(){
  const box=document.getElementById('scene-particles');
  if(box.children.length)return;
  for(let i=0;i<28;i++){
    const p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';p.style.top=(Math.random()*110)+'%';
    p.style.setProperty('--d',(7+Math.random()*10)+'s');
    p.style.setProperty('--x',(-35+Math.random()*70)+'px');
    p.style.animationDelay=(-Math.random()*12)+'s';box.appendChild(p);
  }
}
/* ---------- PANORÁMICAS ILUSTRADAS ÚNICAS ---------- */
function svgData(svg){return `url("data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}")`}
function noiseDefs(){return `<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="17"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter><filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>`}
function stars(n=55){let h='';for(let i=0;i<n;i++){const x=(i*137)%1600,y=(i*71)%520,r=(i%5===0?1.8:1);h+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff6d6" opacity="${.13+(i%7)/40}"/>`}return h}
function pines(count=34,y0=690,scale=1){let h='';for(let i=0;i<count;i++){const x=(i*83)%1660-30;const hgt=(90+(i*37)%170)*scale;const y=y0+((i*29)%55);const dark=i%3===0?'#102019':i%3===1?'#18291e':'#0a1510';h+=`<g transform="translate(${x} ${y})"><rect x="-5" y="-${hgt*.48}" width="10" height="${hgt*.52}" fill="#34281b"/><polygon points="0,-${hgt} -${hgt*.24},-${hgt*.35} ${hgt*.24},-${hgt*.35}" fill="${dark}"/><polygon points="0,-${hgt*.78} -${hgt*.3},-${hgt*.16} ${hgt*.3},-${hgt*.16}" fill="${dark}"/></g>`}return h}
function windows(x,y,w,h,rows,cols,color='#e8bc67'){let out='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if((r+c*2)%5===0)continue;out+=`<rect x="${x+12+c*(w-24)/Math.max(1,cols-1)-3}" y="${y+18+r*(h-38)/Math.max(1,rows-1)-4}" width="6" height="8" rx="1" fill="${color}" opacity="${.45+((r+c)%3)*.16}"/>`}return out}
function cityBlocks(seed=0,warm=false){let h='';for(let i=0;i<17;i++){const x=-30+i*100+(i%3)*13;const bw=78+(i*19)%62,bh=120+(i*47+seed)%230;const y=780-bh;const fill=warm?(i%2?'#4c3228':'#38251f'):(i%2?'#22211e':'#171817');h+=`<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${fill}"/><polygon points="${x-7},${y} ${x+bw/2},${y-38-(i%4)*16} ${x+bw+7},${y}" fill="#11110f"/>${windows(x,y,bw,bh,Math.max(2,Math.floor(bh/52)),3,warm?'#f0a866':'#d8bd78')}</g>`}return h}
function water(){let h='';for(let i=0;i<17;i++){const y=650+i*15;h+=`<path d="M0 ${y} Q 100 ${y-10} 200 ${y} T400 ${y} T600 ${y} T800 ${y} T1000 ${y} T1200 ${y} T1400 ${y} T1600 ${y}" fill="none" stroke="#b8d7d8" stroke-opacity="${.12+(i%4)*.035}" stroke-width="2"/>`}return h}

function panoramaFor(loc){
  const custom={
    'aethrion':sceneAethrion,'darvanis':sceneDarvanis,'serynth':sceneSerynth,
    'bosque-korvan':sceneKorvan,'valle-arden':sceneArden,'velmor':sceneVelmor,
    'tierras-heladas':sceneFrozen,'islas-tronox':sceneTronox,'lagos-eldra':sceneEldra,
    'puerto-libar':sceneLibar,'mar-oeste':sceneWestSea,'desierto-kael':sceneKael,'colinas-vorlen':sceneVorlen
  };
  return (custom[loc.id]||sceneAethrion)();
}
function enterScene(loc){
  current=loc; buildParticles();
  scene.className='scene-'+(loc.scene||'city');
  if(loc.sceneImg){sceneBg.style.backgroundImage=`url('${loc.sceneImg}')`;}
  else{sceneBg.style.backgroundImage=svgData(panoramaFor(loc));}
  document.getElementById('scene-type').textContent=loc.label;
  document.getElementById('scene-name').textContent=loc.name;
  document.getElementById('scene-short').textContent=loc.short||'';
  scene.classList.add('open'); scene.setAttribute('aria-hidden','false');
  setTimeout(()=>scene.focus?.(),0);
}
function leaveScene(){
  scene.classList.remove('open'); scene.setAttribute('aria-hidden','true');
  panel.classList.remove('panel-open'); app.classList.remove('dim'); hud.classList.remove('hud-hide');
  current=null; document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active'));
}
function openCurrentPanel(){ if(current) openPanel(current); }

/* ---------- panel ---------- */
function heroFor(loc){
  /* si hay ilustración propia la usa; si no, recorta el mapa en ese punto */
  if(loc.img){
    hero.style.backgroundImage=`url('${loc.img}')`;
    hero.style.backgroundSize='cover';
    hero.style.backgroundPosition='center';
    return;
  }
  const w=hero.clientWidth||360,h=hero.clientHeight||190;
  const Z=Math.max(3.4,(w/mapW)*4.2);          /* primer plano del mapa */
  const bw=mapW*Z,bh=mapH*Z;
  const px=loc.x/100*bw-w/2, py=loc.y/100*bh-h/2;
  hero.style.backgroundImage=`url('${img.getAttribute('src')}')`;
  hero.style.backgroundSize=bw+'px '+bh+'px';
  hero.style.backgroundPosition=(-px)+'px '+(-py)+'px';
}
function openPanel(loc){
  current=loc;
  document.getElementById('p-type').textContent=loc.label;
  document.getElementById('p-name').textContent=loc.name;
  heroFor(loc);
  let h=`<section class="sec"><div class="sec-title">Descripción</div><p>${loc.desc}</p></section>`;
  if(loc.stats){h+='<section class="sec"><div class="sec-title">Datos</div><div class="stats">';Object.entries(loc.stats).forEach(([k,v])=>h+=`<div class="stat"><small>${k}</small><b>${v}</b></div>`);h+='</div></section>'}
  if(loc.districts){h+='<section class="sec"><div class="sec-title">Dentro de Aethrion</div><div class="districts">';loc.districts.forEach(d=>h+=`<div class="district"><b>${d[0]}</b><span>${d[1]}</span></div>`);h+='</div></section>'}
  if(loc.lore)h+=`<section class="sec"><div class="sec-title">Crónicas</div><div class="quote">${loc.lore}</div></section>`;
  if(loc.places){h+='<section class="sec"><div class="sec-title">Lugares</div>';loc.places.forEach(p=>h+=`<div class="place">${p}</div>`);h+='</section>'}
  h+=`<div class="p-nav"><button onclick="goSibling(-1)">‹ Anterior</button><button onclick="resetView()">Ver todo</button><button onclick="goSibling(1)">Siguiente ›</button></div>`;
  document.getElementById('p-body').innerHTML=h;
  document.querySelector('.panel-body').scrollTop=0;
  panel.classList.add('panel-open');
}
function goSibling(d){
  if(!current)return;
  const i=locations.findIndex(l=>l.id===current.id);
  const next=locations[(i+d+locations.length)%locations.length];
  panel.classList.remove('panel-open');
  setTimeout(()=>focusLocation(next),140);
}
function closePanel(){
  panel.classList.remove('panel-open');
  if(scene.classList.contains('open')) return;
  current=null; app.classList.remove('dim'); hud.classList.remove('hud-hide');
  document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active'));
}

/* ---------- encuadre ---------- */
function fitMap(animated){
  const pad=(innerWidth<720?20:80);
  const s=Math.max(.2,Math.min((innerWidth-pad)/mapW,(innerHeight-pad)/mapH));
  minScale=s*.8;
  const tx=(innerWidth-mapW*s)/2, ty=(innerHeight-mapH*s)/2;
  if(animated) animateTo(s,tx,ty,700); else {scale=s;posX=tx;posY=ty;apply()}
}
function resetView(){if(scene.classList.contains('open'))leaveScene();else closePanel();fitMap(true)}
function zoomAt(cx,cy,f){
  const bx=(cx-posX)/scale,by=(cy-posY)/scale;
  scale=Math.max(minScale,Math.min(maxScale,scale*f));
  posX=cx-bx*scale;posY=cy-by*scale;clamp();apply();
}
function zoomAtCenter(f){
  if(anim)cancelAnimationFrame(anim);
  const cx=innerWidth/2,cy=innerHeight/2;
  const bx=(cx-posX)/scale,by=(cy-posY)/scale;
  const ts=Math.max(minScale,Math.min(maxScale,scale*f));
  animateTo(ts,cx-bx*ts,cy-by*ts,340);
}

/* ---------- gestos ---------- */
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.hotspot'))return;if(anim)cancelAnimationFrame(anim);drag=true;dragged=false;wrap.classList.add('dragging');startX=e.clientX-posX;startY=e.clientY-posY});
addEventListener('mousemove',e=>{if(!drag)return;dragged=true;posX=e.clientX-startX;posY=e.clientY-startY;clamp();apply()});
addEventListener('mouseup',()=>{drag=false;wrap.classList.remove('dragging')});
wrap.addEventListener('wheel',e=>{e.preventDefault();if(anim)cancelAnimationFrame(anim);zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:.89)},{passive:false});
wrap.addEventListener('touchstart',e=>{
  if(anim)cancelAnimationFrame(anim);
  if(e.touches.length===1){startX=e.touches[0].clientX-posX;startY=e.touches[0].clientY-posY}
  else if(e.touches.length===2){lastDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY)}
},{passive:true});
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&!e.target.closest('.hotspot')){posX=e.touches[0].clientX-startX;posY=e.touches[0].clientY-startY;clamp();apply()}
  else if(e.touches.length===2&&lastDist){
    const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    zoomAt(cx,cy,d/lastDist);lastDist=d;
  }
},{passive:false});
/* doble toque / doble click: acerca donde tocaste */
let lastTap=0;
wrap.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTap<300&&e.changedTouches.length===1&&!e.target.closest('.hotspot')){
    const t=e.changedTouches[0],bx=(t.clientX-posX)/scale,by=(t.clientY-posY)/scale;
    const ts=scale<1.8?2.6:minScale*1.25;
    animateTo(ts,t.clientX-bx*ts,t.clientY-by*ts,420);
  }
  lastTap=now;
});
wrap.addEventListener('dblclick',e=>{
  if(e.target.closest('.hotspot'))return;
  const bx=(e.clientX-posX)/scale,by=(e.clientY-posY)/scale;
  const ts=scale<1.8?2.2:minScale*1.25;
  animateTo(ts,e.clientX-bx*ts,e.clientY-by*ts,420);
});
addEventListener('keydown',e=>{if(e.key==='Escape'){ if(panel.classList.contains('panel-open')) closePanel(); else if(scene.classList.contains('open')) leaveScene(); else resetView(); }});

/* ---------- extras ---------- */
function toggleLegend(){document.getElementById('legend').classList.toggle('legend-open');document.getElementById('legend-btn').classList.toggle('active')}
function toggleMusic(){const a=document.getElementById('ambience'),btn=document.getElementById('music-btn');if(a.paused){a.play().then(()=>{btn.classList.add('active');btn.textContent='♬'}).catch(()=>{alert('Poné tu archivo de música como ambiente-cetrios.mp3 en la misma carpeta que este HTML.')})}else{a.pause();btn.classList.remove('active');btn.textContent='♪'}}

/* ---------- init ---------- */
function setup(){
  mapW=900;mapH=mapW*((img.naturalHeight||1100)/(img.naturalWidth||900));
  locations.forEach(addSpot);
  fitMap(false);
  setTimeout(()=>{const l=document.getElementById('loading');l.classList.add('loading-done');setTimeout(()=>l?.remove(),800)},900);
}
addEventListener('resize',()=>{if(!current)fitMap(false)});
if(img.complete)setup();else img.onload=setup;
</script>
