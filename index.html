<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e13"><meta name="description" content="Explorá el mundo de Cetrios. Girá el planeta, descubrí sus reinos y viajá a sus paisajes.">
<title>Cetrios · El mundo de los ecos</title>
<link rel="icon" href="assets/compass.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6 6-2Z"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Zm6-2v16m6-14v16"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
</defs></svg>
<a class="skip" href="#destinations">Ir a los destinos</a>
<header class="topbar">
 <a href="#" class="brand" aria-label="Cetrios, volver al mundo"><svg class="brand-icon"><use href="#i-compass"/></svg><span><b>CETRIOS</b><small>EL MUNDO DE LOS ECOS</small></span></a>
 <div class="view-switch" role="group" aria-label="Vista del mapa"><button id="globe-mode" aria-pressed="true"><svg><use href="#i-globe"/></svg><span>Esfera</span></button><button id="map-mode" aria-pressed="false"><svg><use href="#i-map"/></svg><span>Mapa</span></button></div>
 <button id="mobile-destinations" class="button nav-toggle" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-list"/></svg>Destinos</button>
 <span class="header-note">ATLAS DE CETRIOS <span class="tiny-star">✦</span></span>
</header>
<main id="workspace">
 <button id="sidebar-backdrop" aria-label="Cerrar destinos" hidden></button>
 <aside id="sidebar" aria-label="Destinos de Cetrios">
  <div class="sidebar-heading"><div><p class="eyebrow">EL MUNDO CONOCIDO</p><h1>Elegí tu destino</h1></div><button class="icon-button mobile-close" id="close-destinations" aria-label="Cerrar destinos"><svg><use href="#i-close"/></svg></button></div>
  <nav id="destinations" tabindex="-1" aria-label="Continentes y lugares"></nav>
  <div class="sidebar-foot"><svg><use href="#i-compass"/></svg><span>Un mundo. Muchas historias.</span></div>
 </aside>
 <section id="map-area" aria-label="Mapa interactivo de Cetrios">
  <div class="map-kicker"><span class="eyebrow">CARTOGRAFÍA DEL MUNDO ECO</span><p id="view-title">Continente Central</p></div>
  <div id="viewport" tabindex="0" aria-label="Planeta de Cetrios. Arrastrá para girar, usá más y menos para acercar. Flechas del teclado para mover.">
   <canvas id="globe" aria-hidden="true"></canvas>
   <div id="flat-stage" hidden><img id="flat-map" alt="Mapa oficial de Cetrios con sus continentes, mares y reinos" draggable="false"></div>
   <div id="markers" aria-label="Lugares visibles en el mapa"></div>
  </div>
  <div id="map-loading" role="status"><svg><use href="#i-compass"/></svg><span>Abriendo el atlas…</span></div>
  <div class="north" aria-hidden="true">N<span>│</span></div>
  <div class="map-tools"><button id="zoom-in" class="icon-button" aria-label="Acercar" title="Acercar"><svg><use href="#i-plus"/></svg></button><button id="zoom-out" class="icon-button" aria-label="Alejar" title="Alejar"><svg><use href="#i-minus"/></svg></button><span class="tool-divider"></span><button id="reset" class="icon-button" aria-label="Volver a la vista inicial" title="Vista inicial"><svg><use href="#i-compass"/></svg></button><button id="labels" class="icon-button active" aria-pressed="true" aria-label="Mostrar nombres" title="Mostrar nombres"><svg><use href="#i-pin"/></svg></button></div>
  <div class="map-footer"><p id="gesture-hint">Arrastrá para girar <span>·</span> Acercá para explorar</p><button id="sound" class="icon-button" aria-label="Activar sonido ambiente" aria-pressed="false" title="Sonido ambiente"><svg><use href="#i-sound"/></svg></button></div>
  <button id="featured" class="featured" hidden><img id="featured-image" alt=""><span class="featured-copy"><small id="featured-region"></small><b id="featured-title"></b><span>Viajar a este lugar <svg><use href="#i-next"/></svg></span></span></button>
  <div id="travel-flash" aria-hidden="true"></div>
 </section>
</main>
<dialog id="journey" aria-labelledby="journey-title">
 <div class="journey-art"><img id="journey-image" alt=""><div class="image-scrim"></div><div id="journey-image-error" hidden><p>No se pudo cargar esta vista.</p><button id="retry-image" class="button">Volver a intentar</button></div></div>
 <div class="journey-top"><button id="back-to-world" class="button glass"><svg><use href="#i-back"/></svg>Volver al mundo</button><div class="journey-actions"><button id="fullscreen" class="icon-button glass" aria-label="Ver paisaje sin panel" aria-pressed="false" title="Ver paisaje sin panel"><svg><use href="#i-expand"/></svg></button><button id="close-journey" class="icon-button glass" aria-label="Cerrar lugar"><svg><use href="#i-close"/></svg></button></div></div>
 <div class="journey-content"><div class="journey-intro"><p class="eyebrow" id="journey-region"></p><h2 id="journey-title"></h2><p id="journey-description"></p><div id="subplaces" class="subplaces" aria-label="Lugares de esta región"></div></div><div class="journey-gallery"><div class="gallery-heading"><span>VISTAS DEL LUGAR</span><span id="gallery-count"></span></div><div id="thumbnails" aria-label="Galería"></div><p id="view-caption"></p></div></div>
 <div class="journey-bottom"><button id="previous-place" class="text-button"><svg><use href="#i-back"/></svg>Destino anterior</button><span id="journey-position"></span><button id="next-place" class="text-button">Siguiente destino<svg><use href="#i-next"/></svg></button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><div class="noscript">Activá JavaScript para explorar la esfera interactiva de Cetrios.</div></noscript>
<script src="data.js"></script><script src="globe.js"></script><script src="app.js"></script>
</body></html>
