<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CETRIOS — Mapa Interactivo Final</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold2:#f1d889;--gold3:#755518;--dark:#050302;
  --line:rgba(201,168,76,.26);--green:#68b295;--red:#d63e3e;
  --inv:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#030201;color:var(--gold2);font-family:'Crimson Text',serif}
button{font-family:inherit}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(80,55,18,.12),transparent 40%),#030201;overflow:hidden}
#map-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:linear-gradient(180deg,#050302,#010101)}
#map-wrap.dragging{cursor:grabbing}
#map-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#map-img{display:block;width:900px;height:auto;user-select:none;-webkit-user-drag:none;filter:saturate(1.05) contrast(1.04) brightness(.9);box-shadow:0 0 80px rgba(0,0,0,.8)}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 48%,rgba(0,0,0,.72) 100%);z-index:4;transition:opacity .4s}
.dim #vignette{opacity:.45}

#hud{position:fixed;z-index:20;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;pointer-events:none;transition:opacity .35s,transform .35s}
.hud-hide{opacity:0;transform:translateY(-12px)}
.hud-copy{max-width:min(520px,72vw);text-shadow:0 2px 18px #000}
.hud-kicker{font-family:'Cinzel',serif;font-size:11px;letter-spacing:8px;color:var(--gold);text-transform:uppercase;opacity:.8}
.hud-title{font-family:'Cinzel',serif;font-size:clamp(38px,7vw,78px);line-height:.9;font-weight:900;color:var(--gold2);text-shadow:0 0 28px rgba(201,168,76,.25)}
.hud-sub{font-size:clamp(14px,2.8vw,20px);color:#c9a974;font-style:italic;line-height:1.35;margin-top:8px;max-width:560px}
.hud-hint{margin-top:14px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:var(--gold3);text-transform:uppercase}

.hotspot{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer;transform:translate(-50%,-50%) scale(var(--inv));transform-origin:50% 50%;transition:filter .2s}
.spot-hit{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%}
.mark{position:relative;width:16px;height:16px;display:block}
.mark i{position:absolute;inset:0;transform:rotate(45deg);background:linear-gradient(140deg,#fff3c4,var(--gold) 55%,#8a6a22);border:1px solid rgba(255,240,190,.85);box-shadow:0 0 9px rgba(201,168,76,.75),0 2px 6px rgba(0,0,0,.9)}
.mark s{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid rgba(201,168,76,.45);border-radius:50%;animation:pulse 3.2s ease-in-out infinite}
.hotspot.capital .mark{width:21px;height:21px}
.hotspot.capital .mark i{background:linear-gradient(140deg,#fff8dd,#ffe08a 50%,var(--gold));box-shadow:0 0 16px rgba(255,224,138,.85),0 0 34px rgba(201,168,76,.5)}
.hotspot.region .mark i{background:linear-gradient(140deg,#d8ffe9,#5fa682 60%,#2f5f49);border-color:rgba(200,255,225,.7);box-shadow:0 0 9px rgba(104,178,149,.7),0 2px 6px rgba(0,0,0,.9)}
.hotspot.region .mark s{border-color:rgba(104,178,149,.4)}
.hotspot.danger .mark i{background:linear-gradient(140deg,#ffb0b0,#c61e1e 60%,#6d0f0f);border-color:rgba(255,190,190,.7);box-shadow:0 0 9px rgba(214,62,62,.75),0 2px 6px rgba(0,0,0,.9)}
.hotspot.danger .mark s{border-color:rgba(214,62,62,.38)}
.hotspot:active{filter:brightness(1.4)}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.15}50%{transform:scale(1.05);opacity:.5}}
.spot-label{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:#f4e3ac;white-space:nowrap;padding:6px 10px;border-radius:8px;background:rgba(4,3,1,.72);border:1px solid rgba(201,168,76,.28);text-shadow:0 2px 6px #000;opacity:0;transition:opacity .25s;pointer-events:none}
.show-labels .spot-label{opacity:1}
.hotspot.capital .spot-label{opacity:1;font-size:14px;color:#fff1bd;border-color:rgba(201,168,76,.5)}
.hotspot.active .mark i{box-shadow:0 0 20px #fff0aa,0 0 44px rgba(201,168,76,.8)}

#panel{position:fixed;z-index:80;right:16px;top:16px;bottom:16px;width:min(400px,calc(100vw - 32px));background:linear-gradient(160deg,rgba(12,9,4,.97),rgba(4,3,2,.97));border:1px solid var(--gold3);box-shadow:0 24px 80px rgba(0,0,0,.85);transform:translateX(calc(100% + 28px));transition:transform .42s cubic-bezier(.2,.85,.2,1);overflow:hidden;display:flex;flex-direction:column}
.panel-open{transform:translateX(0)!important}
#p-hero{position:relative;height:190px;flex:0 0 auto;background-color:#0a0704;background-repeat:no-repeat;border-bottom:1px solid rgba(201,168,76,.22);transform:scale(1.06);opacity:0;transition:transform .7s cubic-bezier(.2,.85,.2,1),opacity .5s}
.panel-open #p-hero{transform:scale(1);opacity:1}
#p-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,2,1,.15) 0%,rgba(3,2,1,.55) 55%,rgba(6,4,2,.97) 100%), radial-gradient(circle at 50% 45%,transparent 30%,rgba(0,0,0,.45) 100%)}
.hero-caption{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 24px 14px}
.panel-type{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:7px;text-shadow:0 2px 10px #000}
.panel-name{font-family:'Cinzel',serif;font-size:29px;font-weight:900;color:var(--gold2);line-height:1;text-shadow:0 3px 22px #000,0 0 30px rgba(201,168,76,.3)}
.panel-close{position:absolute;right:14px;top:14px;z-index:5;width:38px;height:38px;background:rgba(5,3,1,.6);border:1px solid var(--gold3);color:var(--gold2);font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.panel-body{padding:22px 24px 34px;overflow:auto;flex:1 1 auto}
.sec{margin-bottom:22px}.sec-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold3);padding-bottom:7px;border-bottom:1px solid rgba(201,168,76,.15);margin-bottom:10px}
.sec p{font-size:15px;color:#b89d5e;line-height:1.65}.sec em{color:var(--gold2);font-style:normal}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid rgba(201,168,76,.13);background:rgba(201,168,76,.045);padding:10px}.stat small{display:block;font-family:'Cinzel',serif;color:var(--gold3);font-size:8px;letter-spacing:2px;text-transform:uppercase}.stat b{display:block;margin-top:4px;color:var(--gold2);font-size:13px}
.quote{border-left:2px solid var(--gold3);background:rgba(201,168,76,.035);padding:11px 14px;color:#927941;font-style:italic;line-height:1.55}
.place{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid rgba(201,168,76,.08);color:#d0b26c}.place:before{content:'◆';font-size:10px;color:var(--gold3)}
.districts{display:grid;grid-template-columns:1fr;gap:9px}.district{background:rgba(201,168,76,.045);border:1px solid rgba(201,168,76,.14);padding:11px 12px}.district b{font-family:'Cinzel',serif;color:var(--gold2);font-size:13px}.district span{display:block;color:#9d854d;font-size:13px;line-height:1.35;margin-top:3px}
.p-nav{display:flex;gap:8px;margin-top:6px}.p-nav button{flex:1;padding:11px 8px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.22);color:var(--gold2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}.p-nav button:active{background:rgba(201,168,76,.2)}

#scene{position:fixed;inset:0;z-index:70;overflow:hidden;background:#050403;opacity:0;pointer-events:none;transition:opacity .28s ease}
#scene.open{opacity:1;pointer-events:auto}
#scene-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,2,1,.06),rgba(3,2,1,.03) 46%,rgba(3,2,1,.76));box-shadow:inset 0 0 140px rgba(0,0,0,.45)}
#scene-overlay:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 52% 35%,transparent 0 38%,rgba(0,0,0,.1) 74%,rgba(0,0,0,.35))}
#scene-overlay:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-8%;height:28%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));filter:blur(8px)}
.scene-top{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:4}
.scene-back{padding:11px 14px;background:rgba(8,6,3,.72);border:1px solid rgba(201,168,76,.24);color:#e8d294;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;border-radius:8px;backdrop-filter:blur(12px);cursor:pointer}
.scene-card{position:absolute;z-index:4;left:min(34px,4vw);bottom:min(26px,4vw);width:min(560px,calc(100vw - 68px));padding:26px 28px;background:linear-gradient(115deg,rgba(7,5,3,.8),rgba(7,5,3,.52));border:1px solid rgba(241,216,137,.36);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.scene-type{font-family:'Cinzel',serif;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#c7a454;opacity:.9}
.scene-name{font-family:'Cinzel',serif;font-size:clamp(42px,7vw,64px);line-height:.94;font-weight:900;color:#f3dd9c;text-shadow:0 4px 26px rgba(0,0,0,.55)}
.scene-short{font-size:22px;line-height:1.42;color:#ddc78b;margin-top:12px;max-width:620px}
.scene-enter{margin-top:17px;border:1px solid rgba(241,216,137,.5);background:rgba(201,168,76,.12);color:#f5df9c;padding:12px 15px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:8px}
.scene-enter:hover{background:rgba(201,168,76,.22)}

#controls{position:fixed;z-index:30;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.ctrl{width:46px;height:46px;background:rgba(6,4,2,.82);border:1px solid var(--gold3);color:var(--gold2);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.ctrl:active{background:rgba(201,168,76,.22)}
#right-actions{position:fixed;z-index:30;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.round{width:50px;height:50px;border-radius:50%;border:1px solid var(--gold3);background:rgba(6,4,2,.84);color:var(--gold2);font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.55);backdrop-filter:blur(12px)}
.round.active{background:radial-gradient(circle,rgba(201,168,76,.32),rgba(6,4,2,.9));box-shadow:0 0 24px rgba(201,168,76,.28)}
#legend{position:fixed;z-index:45;right:max(78px,calc(env(safe-area-inset-right) + 78px));bottom:max(18px,env(safe-area-inset-bottom));width:min(290px,calc(100vw - 112px));background:rgba(7,5,2,.94);border:1px solid var(--gold3);box-shadow:0 20px 60px rgba(0,0,0,.75);padding:15px 17px;backdrop-filter:blur(15px);transform:translateY(15px) scale(.98);opacity:0;pointer-events:none;transition:.22s}
.legend-open{opacity:1!important;transform:translateY(0) scale(1)!important;pointer-events:auto!important}.legend-title{font-family:'Cinzel',serif;color:var(--gold2);font-size:11px;letter-spacing:4px;margin-bottom:12px}.legend-row{display:flex;align-items:center;gap:11px;font-family:'Cinzel',serif;color:#a58a50;font-size:11px;letter-spacing:1.5px;margin:9px 0}
.ld{width:12px;height:12px;flex:0 0 auto;transform:rotate(45deg)}.ld.cap{background:linear-gradient(140deg,#fff8dd,var(--gold))}.ld.city{background:linear-gradient(140deg,#fff3c4,var(--gold) 55%,#8a6a22)}.ld.reg{background:linear-gradient(140deg,#d8ffe9,#5fa682)}.ld.dan{background:linear-gradient(140deg,#ffb0b0,#c61e1e)}
#loading{position:fixed;z-index:999;inset:0;background:#030201;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s}.loading-done{opacity:0;pointer-events:none}.load-title{font-family:'Cinzel',serif;font-size:clamp(42px,10vw,72px);letter-spacing:14px;color:var(--gold);text-shadow:0 0 45px rgba(201,168,76,.35)}.load-sub{font-style:italic;color:#927941}.loadbar{width:min(320px,70vw);height:2px;background:rgba(201,168,76,.12);overflow:hidden}.loadbar:after{content:'';display:block;width:55%;height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1.4s infinite}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(220%)}}

@media(max-width:720px){
  #hud{top:14px;left:14px;right:14px}.hud-copy{max-width:78vw}.hud-kicker{font-size:9px;letter-spacing:5px}.hud-title{font-size:42px}.hud-sub{font-size:15px;max-width:280px}
  #panel{left:0;right:0;top:auto;bottom:0;width:100%;height:74vh;border-left:0;border-right:0;border-bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%)} .panel-open{transform:translateY(0)!important}
  #p-hero{height:168px;border-radius:20px 20px 0 0}.panel-name{font-size:25px}.panel-body{padding:18px 22px 40px}.stats{grid-template-columns:1fr}.ctrl{width:42px;height:42px}.round{width:48px;height:48px}.spot-label{font-size:11.5px;padding:5px 8px}
  #legend{right:76px;bottom:18px;width:calc(100vw - 106px)}
  .scene-card{padding:18px 18px;bottom:14px;width:calc(100vw - 28px);left:14px}.scene-name{font-size:clamp(34px,10vw,48px)}.scene-short{font-size:16px}.scene-enter{width:100%}
}
@media(max-height:560px){#panel{height:88vh}.hud-sub{display:none}.hud-title{font-size:34px}}
@media (prefers-reduced-motion:reduce){#p-hero{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="loading"><div class="load-title">CETRIOS</div><div class="load-sub">Abriendo los caminos de Cetrios...</div><div class="loadbar"></div></div>

  <div id="hud"><div class="hud-copy">
    <div class="hud-kicker">Mapa del Mundo</div>
    <div class="hud-title">CETRIOS</div>
    <div class="hud-sub">Un mundo de reinos antiguos, donde los Ecos despiertan entre montañas y mares.</div>
    <div class="hud-hint">Tocá un punto para viajar</div>
  </div></div>

  <div id="map-wrap"><div id="map-stage"><img id="map-img" src="map.png" alt="Mapa de Cetrios" draggable="false"></div></div>
  <div id="vignette"></div>

  <section id="scene" aria-hidden="true">
    <canvas id="scene-canvas"></canvas>
    <div id="scene-overlay"></div>
    <div class="scene-top"><button class="scene-back" onclick="leaveScene()">← Volver al mapa</button></div>
    <div class="scene-card"><div class="scene-type" id="scene-type"></div><div class="scene-name" id="scene-name"></div><div class="scene-short" id="scene-short"></div><button class="scene-enter" onclick="openCurrentPanel()">Explorar este lugar</button></div>
  </section>

  <aside id="panel">
    <button class="panel-close" onclick="closePanel()" aria-label="Cerrar">×</button>
    <div id="p-hero"><div class="hero-caption"><div class="panel-type" id="p-type"></div><div class="panel-name" id="p-name"></div></div></div>
    <div class="panel-body" id="p-body"></div>
  </aside>

  <div id="controls"><button class="ctrl" onclick="zoomAtCenter(1.25)" aria-label="Acercar">+</button><button class="ctrl" onclick="zoomAtCenter(.8)" aria-label="Alejar">−</button><button class="ctrl" onclick="resetView()" style="font-size:17px" aria-label="Ver todo el mapa">⌂</button></div>
  <div id="right-actions"><button id="legend-btn" class="round" onclick="toggleLegend()" aria-label="Leyenda">?</button><button id="music-btn" class="round" onclick="toggleMusic()" aria-label="Música">♪</button></div>
  <div id="legend"><div class="legend-title">LEYENDA</div><div class="legend-row"><span class="ld cap"></span>Capital</div><div class="legend-row"><span class="ld city"></span>Ciudad / Reino</div><div class="legend-row"><span class="ld reg"></span>Región / Bosque</div><div class="legend-row"><span class="ld dan"></span>Zona peligrosa</div></div>
  <audio id="ambience" src="ambiente-cetrios.mp3" loop preload="none"></audio>
</div>

<script>
const locations=[
{id:'aethrion',x:50,y:44,type:'capital',label:'Capital',name:'Aethrion',short:'El corazón palpitante de Cetrios.',stats:{Población:'~800.000',Clima:'Templado',Importancia:'Reino central'},desc:`<em>Aethrion</em> es la capital de Cetrios: una ciudad circular amurallada, construida alrededor del Palacio Negro. Sus anillos interiores concentran mercados, templos del Eco, pasajes nobles y rutas ocultas que bajan hacia antiguos túneles.`,lore:`“Quien domina Aethrion no domina solamente un palacio. Domina el símbolo que todos los reinos miran antes de decidir si obedecen o se rebelan.”`,places:['Palacio Negro','Mercado de los Siete Velos','Murallas internas','Canales y puentes','Catacumbas antiguas']},
{id:'velmor',x:34,y:24,type:'city',label:'Reino',name:'Velmor',short:'El reino frío de las montañas del norte.',stats:{Clima:'Glacial',Carácter:'Aislado'},desc:`<em>Velmor</em> es un reino de piedra, bosque y frío. Sus torres oscuras emergen entre montañas y árboles antiguos.`,lore:`“En Velmor, el viento recuerda mejor que los libros.”`,places:['Fortaleza de Velmor','Puesto de Hielo','Rutas del Norte']},
{id:'darvanis',x:21,y:52,type:'city',label:'Ciudad-Estado',name:'Darvanis',short:'Ciudad de mercaderes, pactos y secretos.',stats:{Comercio:'Muy alto',Influencia:'Subterránea'},desc:`<em>Darvanis</em> compra lo que no puede conquistar y vende lo que otros temen preguntar.`,lore:`“Si un secreto tiene precio, Darvanis ya lo tasó.”`,places:['Mercado negro','Torre de gremios','Rutas de contrabando']},
{id:'bosque-korvan',x:62,y:22,type:'region',label:'Región',name:'Bosque de Korvan',short:'El bosque que respira y recuerda.',stats:{Acceso:'Restringido',Misterio:'Alto'},desc:`El <em>Bosque de Korvan</em> guarda memorias antiguas. En el Claro del Eco, las almas parecen hablar más fuerte.`,lore:`“No todos los árboles dan sombra. Algunos guardan nombres.”`,places:['Claro del Eco','Árbol Madre','Senderos ocultos']},
{id:'tierras-heladas',x:50,y:6,type:'danger',label:'Zona peligrosa',name:'Tierras Heladas',short:'Más allá del norte, pocos regresan.',stats:{Peligro:'Extremo',Clima:'Letal'},desc:`Las <em>Tierras Heladas</em> son el límite del mundo conocido. Allí el mapa deja de prometer respuestas.`,lore:`“El norte no mata rápido. Primero te convence de quedarte.”`,places:['Montañas blancas','Rutas perdidas','Ciudad de cristal — leyenda']},
{id:'islas-tronox',x:84,y:36,type:'region',label:'Archipiélago',name:'Islas de Tronox',short:'Tronox Mayor y Tronox Menor.',stats:{Gobierno:'Consejo',Acceso:'Marítimo'},desc:`Las <em>Islas de Tronox</em> están separadas de Cetrios por aguas difíciles. Tronox Mayor concentra poder; Tronox Menor conserva secretos antiguos.`,lore:`“En Tronox no se pregunta quién manda. Se pregunta quién sobrevivió para contarlo.”`,places:['Tronox Mayor','Tronox Menor','Puertos ocultos']},
{id:'valle-arden',x:50,y:68,type:'region',label:'Valle',name:'Valle de Arden',short:'Refugio, reconstrucción y tierra fértil.',stats:{Clima:'Templado',Importancia:'Refugio'},desc:`El <em>Valle de Arden</em> es fértil, protegido y disputado. Allí algunos encuentran libertad lejos del peso de Aethrion.`,lore:`“Arden no promete salvarte. Solo te da espacio para volver a levantarte.”`,places:['Liedor','Cicus','Refugios antiguos']},
{id:'lagos-eldra',x:30,y:68,type:'region',label:'Región lacustre',name:'Lagos de Eldra',short:'Aguas profundas y puertos antiguos.',stats:{Agua:'Abundante',Peligro:'Moderado'},desc:`Los <em>Lagos de Eldra</em> conectan pueblos, puertos y memorias que el agua nunca termina de devolver.`,lore:`“Eldra escucha incluso cuando nadie habla.”`,places:['Puerto de Eldra','Puerto Inlet','Roca del Guardián']},
{id:'desierto-kael',x:70,y:82,type:'danger',label:'Desierto',name:'Desierto de Kael',short:'Bajo sus ruinas duerme Murmex.',stats:{Peligro:'Muy alto',Agua:'Escasa'},desc:`El <em>Desierto de Kael</em> oculta ruinas enterradas bajo capas de arena. Allí se busca a Murmex: no como una criatura visible, sino como una presencia antigua escondida bajo el mundo.`,lore:`“Kael no guarda muertos. Guarda puertas.”`,places:['Ruinas de Kael','Entrada perdida','Cámaras bajo la arena','Murmex dormido']},

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function focusLocation(loc){const mobile=innerWidth<720;const target=Math.min(maxScale,mobile?3.35:2.45);const x=loc.x/100*mapW,y=loc.y/100*mapH;const anchorY=mobile?innerHeight*.36:innerHeight*.48;const anchorX=innerWidth/2;const tx=anchorX-x*target,ty=anchorY-y*target;app.classList.add('dim');hud.classList.add('hud-hide');document.querySelectorAll('.hotspot').forEach(h=>h.classList.toggle('active',h.dataset.id===loc.id));animateTo(target,tx,ty,520,()=>enterScene(loc))}

function hexToRgba(hex,a){const n=hex.replace('#','');const v=n.length===3?n.split('').map(c=>c+c).join(''):n;const num=parseInt(v,16);return `rgba(${(num>>16)&255},${(num>>8)&255},${num&255},${a})`}

function resizeIfNeeded(){const dpr=Math.min(2,window.devicePixelRatio||1); if(sceneCanvas.width!==Math.round(innerWidth*dpr) || sceneCanvas.height!==Math.round(innerHeight*dpr)) resizeSceneCanvas() }
function enterScene(loc){current=loc; document.getElementById('scene-type').textContent=loc.label; document.getElementById('scene-name').textContent=loc.name; document.getElementById('scene-short').textContent=loc.short||''; drawScene(loc); scene.classList.add('open'); scene.setAttribute('aria-hidden','false')}
function leaveScene(){scene.classList.remove('open'); scene.setAttribute('aria-hidden','true'); panel.classList.remove('panel-open'); app.classList.remove('dim'); hud.classList.remove('hud-hide'); current=null; document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active'))}
function openCurrentPanel(){if(current) openPanel(current)}
function sceneSnapshot(loc){drawScene(loc); try{return sceneCanvas.toDataURL('image/jpeg',.92)}catch(e){return null}}
function heroFor(loc){const shot=sceneSnapshot(loc); if(shot){hero.style.backgroundImage=`url('${shot}')`; hero.style.backgroundSize='cover'; hero.style.backgroundPosition='center'; return;} const w=hero.clientWidth||360,h=hero.clientHeight||190;const Z=Math.max(3.4,(w/mapW)*4.2);const bw=mapW*Z,bh=mapH*Z;const px=loc.x/100*bw-w/2,py=loc.y/100*bh-h/2;hero.style.backgroundImage=`url('${img.getAttribute('src')}')`;hero.style.backgroundSize=bw+'px '+bh+'px';hero.style.backgroundPosition=(-px)+'px '+(-py)+'px'}
function openPanel(loc){current=loc;document.getElementById('p-type').textContent=loc.label;document.getElementById('p-name').textContent=loc.name;heroFor(loc);let h=`<section class="sec"><div class="sec-title">Descripción</div><p>${loc.desc}</p></section>`;if(loc.stats){h+='<section class="sec"><div class="sec-title">Datos</div><div class="stats">';Object.entries(loc.stats).forEach(([k,v])=>h+=`<div class="stat"><small>${k}</small><b>${v}</b></div>`);h+='</div></section>'}if(loc.lore)h+=`<section class="sec"><div class="sec-title">Crónicas</div><div class="quote">${loc.lore}</div></section>`;if(loc.places){h+='<section class="sec"><div class="sec-title">Lugares</div>';loc.places.forEach(p=>h+=`<div class="place">${p}</div>`);h+='</section>'}h+=`<div class="p-nav"><button onclick="goSibling(-1)">‹ Anterior</button><button onclick="resetView()">Ver todo</button><button onclick="goSibling(1)">Siguiente ›</button></div>`;document.getElementById('p-body').innerHTML=h;document.querySelector('.panel-body').scrollTop=0;panel.classList.add('panel-open')}
function goSibling(d){if(!current)return;const i=locations.findIndex(l=>l.id===current.id);const next=locations[(i+d+locations.length)%locations.length];panel.classList.remove('panel-open');setTimeout(()=>focusLocation(next),140)}
function closePanel(){panel.classList.remove('panel-open'); if(scene.classList.contains('open')) return; current=null; app.classList.remove('dim'); hud.classList.remove('hud-hide'); document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active'))}
function fitMap(animated){const pad=(innerWidth<720?20:80);const s=Math.max(.2,Math.min((innerWidth-pad)/mapW,(innerHeight-pad)/mapH));minScale=s*.8;const tx=(innerWidth-mapW*s)/2,ty=(innerHeight-mapH*s)/2;if(animated) animateTo(s,tx,ty,700);else{scale=s;posX=tx;posY=ty;apply()}}
function resetView(){if(scene.classList.contains('open'))leaveScene();else closePanel();fitMap(true)}
function zoomAt(cx,cy,f){const bx=(cx-posX)/scale,by=(cy-posY)/scale;scale=Math.max(minScale,Math.min(maxScale,scale*f));posX=cx-bx*scale;posY=cy-by*scale;clamp();apply()}
function zoomAtCenter(f){if(anim)cancelAnimationFrame(anim);const cx=innerWidth/2,cy=innerHeight/2;const bx=(cx-posX)/scale,by=(cy-posY)/scale;const ts=Math.max(minScale,Math.min(maxScale,scale*f));animateTo(ts,cx-bx*ts,cy-by*ts,340)}

wrap.addEventListener('mousedown',e=>{if(e.target.closest('.hotspot'))return;if(anim)cancelAnimationFrame(anim);drag=true;wrap.classList.add('dragging');startX=e.clientX-posX;startY=e.clientY-posY});
addEventListener('mousemove',e=>{if(!drag)return;posX=e.clientX-startX;posY=e.clientY-startY;clamp();apply()});addEventListener('mouseup',()=>{drag=false;wrap.classList.remove('dragging')});
wrap.addEventListener('wheel',e=>{e.preventDefault();if(anim)cancelAnimationFrame(anim);zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:.89)},{passive:false});
wrap.addEventListener('touchstart',e=>{if(anim)cancelAnimationFrame(anim);if(e.touches.length===1){startX=e.touches[0].clientX-posX;startY=e.touches[0].clientY-posY}else if(e.touches.length===2){lastDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY)}},{passive:true});
wrap.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&!e.target.closest('.hotspot')){posX=e.touches[0].clientX-startX;posY=e.touches[0].clientY-startY;clamp();apply()}else if(e.touches.length===2&&lastDist){const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;zoomAt(cx,cy,d/lastDist);lastDist=d}},{passive:false});
let lastTap=0;wrap.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTap<300&&e.changedTouches.length===1&&!e.target.closest('.hotspot')){const t=e.changedTouches[0],bx=(t.clientX-posX)/scale,by=(t.clientY-posY)/scale;const ts=scale<1.8?2.6:minScale*1.25;animateTo(ts,t.clientX-bx*ts,t.clientY-by*ts,420)}lastTap=now});
wrap.addEventListener('dblclick',e=>{if(e.target.closest('.hotspot'))return;const bx=(e.clientX-posX)/scale,by=(e.clientY-posY)/scale;const ts=scale<1.8?2.2:minScale*1.25;animateTo(ts,e.clientX-bx*ts,e.clientY-by*ts,420)});
addEventListener('keydown',e=>{if(e.key==='Escape')resetView()});
function toggleLegend(){document.getElementById('legend').classList.toggle('legend-open');document.getElementById('legend-btn').classList.toggle('active')}
function toggleMusic(){const a=document.getElementById('ambience'),btn=document.getElementById('music-btn');if(a.paused){a.play().then(()=>{btn.classList.add('active');btn.textContent='♬'}).catch(()=>{alert('Poné tu archivo de música como ambiente-cetrios.mp3 en la misma carpeta que este HTML.')})}else{a.pause();btn.classList.remove('active');btn.textContent='♪'}}
function setup(){mapW=900;mapH=mapW*((img.naturalHeight||1100)/(img.naturalWidth||900));locations.forEach(addSpot);fitMap(false);resizeSceneCanvas();setTimeout(()=>{const l=document.getElementById('loading');l.classList.add('loading-done');setTimeout(()=>l?.remove(),800)},900)}
addEventListener('resize',()=>{if(!current)fitMap(false); resizeSceneCanvas()}); if(img.complete)setup(); else img.onload=setup;
</script>
