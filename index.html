<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CETRIOS — Mapa Interactivo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dark: #8a6a1a;
    --dark: #0a0804;
    --glow: rgba(201,168,76,0.4);
    --panel-bg: rgba(10,8,4,0.95);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050302;
    font-family: 'Crimson Text', serif;
    color: var(--gold-light);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: crosshair;
  }

  #map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #map-stage {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  #map-img {
    display: block;
    width: 900px;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    filter: brightness(0.92) contrast(1.05);
  }

  /* ── HOTSPOTS ── */
  .hotspot {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    transform: translate(-50%, -50%);
  }

  .hotspot-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.3s ease;
  }

  .hotspot-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-light) 0%, var(--gold) 60%, transparent 100%);
    box-shadow: 0 0 8px var(--gold), 0 0 16px var(--glow);
    border: 1px solid var(--gold-light);
    transition: all 0.25s ease;
    position: relative;
    z-index: 2;
  }

  .hotspot:hover .hotspot-ring,
  .hotspot:active .hotspot-ring {
    opacity: 1;
    transform: scale(1);
    animation: pulse-ring 1.5s ease-in-out infinite;
  }

  .hotspot:hover .hotspot-dot,
  .hotspot:active .hotspot-dot {
    transform: scale(1.4);
    box-shadow: 0 0 16px var(--gold), 0 0 32px var(--glow);
  }

  .hotspot.capital .hotspot-dot {
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, #fff5c0 0%, var(--gold-light) 40%, var(--gold) 80%);
    animation: capital-glow 2.5s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(1.3); }
  }

  @keyframes capital-glow {
    0%, 100% { box-shadow: 0 0 12px var(--gold), 0 0 24px var(--gold), 0 0 40px var(--glow); }
    50% { box-shadow: 0 0 20px var(--gold-light), 0 0 40px var(--gold), 0 0 60px var(--glow); }
  }

  /* ── DANGER ZONE ANIMATIONS ── */
  .danger-aura {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 5;
  }

  .danger-aura-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(204,34,34,0.4);
    animation: danger-expand 3s ease-out infinite;
  }

  .danger-aura-ring:nth-child(2) { animation-delay: 1s; }
  .danger-aura-ring:nth-child(3) { animation-delay: 2s; }

  @keyframes danger-expand {
    0% { width: 20px; height: 20px; opacity: 0.8; margin: -10px; }
    100% { width: 80px; height: 80px; opacity: 0; margin: -40px; }
  }

  /* ── LIGHTNING ── */
  .lightning-container {
    position: absolute;
    pointer-events: none;
    z-index: 6;
    transform: translate(-50%, -50%);
  }

  .lightning-bolt {
    position: absolute;
    width: 2px;
    background: linear-gradient(180deg, rgba(150,180,255,0.9), transparent);
    transform-origin: top center;
    animation: lightning-flash 4s ease-in-out infinite;
    border-radius: 1px;
  }

  @keyframes lightning-flash {
    0%, 85%, 100% { opacity: 0; }
    87% { opacity: 1; }
    89% { opacity: 0.3; }
    91% { opacity: 1; }
    93% { opacity: 0; }
  }

  /* ── FOG ── */
  .fog-particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,220,255,0.15), transparent);
    pointer-events: none;
    z-index: 7;
    animation: fog-drift linear infinite;
  }

  @keyframes fog-drift {
    0% { transform: translate(0,0) scale(1); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 0.6; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; }
  }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: 280px;
  }

  #tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .tooltip-inner {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--gold);
    padding: 14px 18px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.8), inset 0 1px 0 rgba(201,168,76,0.2);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }

  .tooltip-type {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 4px;
  }

  .tooltip-name {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 900;
    color: var(--gold-light);
    line-height: 1.2;
    margin-bottom: 6px;
    text-shadow: 0 0 20px var(--glow);
  }

  .tooltip-desc {
    font-size: 13px;
    color: #b8a060;
    line-height: 1.5;
    font-style: italic;
  }

  /* ── DETAIL PANEL ── */
  #panel {
    position: fixed;
    right: 0; top: 0;
    height: 100%;
    width: 340px;
    background: linear-gradient(160deg, rgba(12,9,4,0.98) 0%, rgba(8,6,2,0.98) 100%);
    border-left: 1px solid var(--gold-dark);
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    z-index: 200;
    overflow-y: auto;
    overflow-x: hidden;
  }

  #panel.open { transform: translateX(0); }

  .panel-header {
    padding: 32px 28px 20px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    position: relative;
    background: linear-gradient(180deg, rgba(201,168,76,0.05) 0%, transparent 100%);
  }

  .panel-type {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 8px;
  }

  .panel-name {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--gold-light);
    line-height: 1.1;
    text-shadow: 0 0 30px var(--glow);
  }

  .panel-close {
    position: absolute;
    top: 20px; right: 20px;
    width: 32px; height: 32px;
    border: 1px solid var(--gold-dark);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .panel-close:hover { background: var(--gold-dark); color: var(--dark); }

  .panel-body { padding: 24px 28px; }
  .panel-section { margin-bottom: 24px; }

  .panel-section-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }

  .panel-section p {
    font-size: 14px;
    color: #a89050;
    line-height: 1.75;
  }

  .panel-section p em { color: var(--gold-light); font-style: normal; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .stat-item {
    background: rgba(201,168,76,0.04);
    border: 1px solid rgba(201,168,76,0.12);
    padding: 10px 12px;
  }

  .stat-label {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 4px;
  }

  .stat-value { font-size: 13px; color: var(--gold-light); font-weight: 600; }

  .lore-quote {
    border-left: 2px solid var(--gold-dark);
    padding: 10px 14px;
    background: rgba(201,168,76,0.03);
    font-style: italic;
    font-size: 13px;
    color: #8a7040;
    line-height: 1.7;
  }

  /* ── HUD ── */
  #hud {
    position: fixed;
    top: 20px; left: 20px;
    z-index: 50;
    pointer-events: none;
  }

  .hud-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gold-dark);
  }

  .hud-world {
    font-family: 'Cinzel', serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--gold-light);
    text-shadow: 0 0 40px var(--glow), 0 2px 4px rgba(0,0,0,0.8);
    line-height: 1;
  }

  .hud-sub {
    font-size: 12px;
    color: var(--gold-dark);
    font-style: italic;
    margin-top: 4px;
    max-width: 240px;
    line-height: 1.4;
  }

  /* ── CONTROLS ── */
  #controls {
    position: fixed;
    bottom: 24px; left: 24px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ctrl-btn {
    width: 36px; height: 36px;
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    pointer-events: all;
  }
  .ctrl-btn:hover { background: var(--gold-dark); color: var(--dark); }

  /* ── MUSIC BUTTON ── */
  #music-btn {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 50;
    width: 44px; height: 44px;
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    color: var(--gold);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(201,168,76,0.2);
  }
  #music-btn:hover { background: var(--gold-dark); color: var(--dark); }
  #music-btn.playing {
    border-color: var(--gold);
    box-shadow: 0 0 16px var(--glow);
    animation: music-pulse 2s ease-in-out infinite;
  }

  @keyframes music-pulse {
    0%, 100% { box-shadow: 0 0 16px var(--glow); }
    50% { box-shadow: 0 0 28px rgba(201,168,76,0.6); }
  }

  /* ── LEGEND ── */
  #legend {
    position: fixed;
    bottom: 80px; right: 24px;
    z-index: 50;
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    padding: 14px 18px;
    backdrop-filter: blur(8px);
  }

  .legend-title {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 11px;
    color: #8a7040;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .ld-capital { background: radial-gradient(circle, #fff5c0, var(--gold)); box-shadow: 0 0 6px var(--gold); }
  .ld-city { background: radial-gradient(circle, var(--gold-light), var(--gold-dark)); }
  .ld-region { background: radial-gradient(circle, #7aad9a, #3a6b5a); }
  .ld-danger { background: radial-gradient(circle, #d44, #922); }

  /* ── LOADING ── */
  #loading {
    position: fixed;
    inset: 0;
    background: #050302;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.8s ease;
  }

  #loading.done { opacity: 0; pointer-events: none; }

  .loading-title {
    font-family: 'Cinzel', serif;
    font-size: 48px;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 12px;
    text-shadow: 0 0 60px var(--glow);
    animation: flicker 3s ease-in-out infinite;
  }

  .loading-sub {
    font-size: 14px;
    color: var(--gold-dark);
    font-style: italic;
    letter-spacing: 2px;
  }

  .loading-bar {
    width: 280px; height: 2px;
    background: rgba(201,168,76,0.1);
    position: relative; overflow: hidden;
  }

  .loading-fill {
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: loading-sweep 1.8s ease-in-out infinite;
  }

  @keyframes loading-sweep { to { left: 100%; } }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; } 93% { opacity: 0.6; }
    94% { opacity: 1; } 96% { opacity: 0.8; } 97% { opacity: 1; }
  }

  #panel::-webkit-scrollbar { width: 4px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb { background: var(--gold-dark); }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-title">CETRIOS</div>
  <div class="loading-sub">Cargando el mundo antiguo...</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<div id="hud">
  <div class="hud-title">Mapa del Mundo</div>
  <div class="hud-world">CETRIOS</div>
  <div class="hud-sub">Un mundo de reinos antiguos, donde la magia savorra entre montañas y mares</div>
</div>

<div id="map-wrap">
  <div id="map-stage">
    <img id="map-img" src="map.png" alt="Mapa de Cetrios" draggable="false">
  </div>
</div>

<div id="tooltip">
  <div class="tooltip-inner">
    <div class="tooltip-type" id="tt-type"></div>
    <div class="tooltip-name" id="tt-name"></div>
    <div class="tooltip-desc" id="tt-desc"></div>
  </div>
</div>

<div id="panel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-type" id="p-type"></div>
    <div class="panel-name" id="p-name"></div>
  </div>
  <div class="panel-body" id="p-body"></div>
</div>

<div id="controls">
  <button class="ctrl-btn" onclick="zoom(1.2)">+</button>
  <button class="ctrl-btn" onclick="zoom(0.8)">−</button>
  <button class="ctrl-btn" onclick="resetView()" style="font-size:13px">⌂</button>
</div>

<button id="music-btn" onclick="toggleAmbience()" title="Sonido ambiente">♪</button>

<div id="legend">
  <div class="legend-title">Leyenda</div>
  <div class="legend-item"><div class="legend-dot ld-capital"></div>Capital</div>
  <div class="legend-item"><div class="legend-dot ld-city"></div>Ciudad / Reino</div>
  <div class="legend-item"><div class="legend-dot ld-region"></div>Región / Bosque</div>
  <div class="legend-item"><div class="legend-dot ld-danger"></div>Zona Peligrosa</div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  AMBIENT SOUND ENGINE — Medieval Town + Nature
//  Todo generado con Web Audio API, sin archivos externos
// ══════════════════════════════════════════════════════
let audioCtx = null;
let ambienceNodes = [];
let ambiencePlaying = false;
let bellTimeout = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// ── Ruido de viento suave
function createWind(master) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 4, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 300;
  filter.Q.value = 0.4;

  // Modulación lenta para efecto de ráfaga
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.08;
  lfoGain.gain.value = 0.025;
  lfo.connect(lfoGain);
  lfoGain.connect(filter.frequency);
  lfo.start();

  const gain = audioCtx.createGain();
  gain.gain.value = 0.055;

  src.connect(filter);
  filter.connect(gain);
  gain.connect(master);
  src.start();

  ambienceNodes.push(src, filter, gain, lfo, lfoGain);
}

// ── Murmullo de gente (mercado medieval)
function createCrowdMurmur(master) {
  // Varias voces con ruido filtrado a diferentes frecuencias
  const freqs = [180, 260, 340, 420, 520];
  freqs.forEach((f, i) => {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 3, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let j = 0; j < data.length; j++) data[j] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.loopStart = Math.random() * 2;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = f;
    filter.Q.value = 6;

    // LFO para dar sensación de conversación
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    lfo.frequency.value = 0.3 + Math.random() * 0.4;
    lfoG.gain.value = f * 0.15;
    lfo.connect(lfoG);
    lfoG.connect(filter.frequency);
    lfo.start();

    const gain = audioCtx.createGain();
    gain.gain.value = 0.018 + Math.random() * 0.008;

    src.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    src.start(audioCtx.currentTime + i * 0.3);

    ambienceNodes.push(src, filter, gain, lfo, lfoG);
  });
}

// ── Pájaros (trinos sintéticos)
function scheduleBird() {
  if (!ambiencePlaying) return;
  const delay = 2000 + Math.random() * 5000;
  bellTimeout = setTimeout(() => {
    if (!ambiencePlaying || !audioCtx) return;
    chirpBird();
    scheduleBird();
  }, delay);
}

function chirpBird() {
  // Tipo de pájaro al azar
  const type = Math.floor(Math.random() * 3);

  if (type === 0) {
    // Trino rápido (gorrión)
    const notes = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < notes; i++) {
      const baseFreq = 2000 + Math.random() * 1500;
      setTimeout(() => {
        if (!ambiencePlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const t = audioCtx.currentTime;
        osc.frequency.setValueAtTime(baseFreq, t);
        osc.frequency.linearRampToValueAtTime(baseFreq * (1.1 + Math.random() * 0.3), t + 0.06);
        osc.frequency.linearRampToValueAtTime(baseFreq * 0.9, t + 0.12);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.06 + Math.random() * 0.04, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      }, i * 120 + Math.random() * 40);
    }
  } else if (type === 1) {
    // Canto largo (mirlo)
    const baseFreq = 1200 + Math.random() * 800;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    const t = audioCtx.currentTime;
    osc.frequency.setValueAtTime(baseFreq, t);
    osc.frequency.linearRampToValueAtTime(baseFreq * 1.4, t + 0.2);
    osc.frequency.linearRampToValueAtTime(baseFreq * 1.1, t + 0.5);
    osc.frequency.linearRampToValueAtTime(baseFreq * 1.6, t + 0.7);
    osc.frequency.linearRampToValueAtTime(baseFreq * 0.8, t + 1.0);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.07, t + 0.1);
    gain.gain.setValueAtTime(0.07, t + 0.8);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 1.2);
  } else {
    // Llamada corta (paloma / cuervo)
    const baseFreq = 400 + Math.random() * 300;
    for (let i = 0; i < 2; i++) {
      setTimeout(() => {
        if (!ambiencePlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        const t = audioCtx.currentTime;
        osc.frequency.setValueAtTime(baseFreq, t);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.7, t + 0.25);
        gain.gain.setValueAtTime(0.055, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.35);
      }, i * 380);
    }
  }
}

// ── Campana lejana de iglesia/torre
function scheduleBell() {
  if (!ambiencePlaying) return;
  const delay = 15000 + Math.random() * 25000;
  setTimeout(() => {
    if (!ambiencePlaying || !audioCtx) return;
    ringBell();
    scheduleBell();
  }, delay);
}

function ringBell() {
  const strikes = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < strikes; i++) {
    setTimeout(() => {
      if (!ambiencePlaying || !audioCtx) return;
      const t = audioCtx.currentTime;

      // Campana principal
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // Reverb simple
      const convolver = audioCtx.createConvolver();
      const rvBuf = audioCtx.createBuffer(2, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = rvBuf.getChannelData(c);
        for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 3);
      }
      convolver.buffer = rvBuf;
      const rvGain = audioCtx.createGain();
      rvGain.gain.value = 0.4;

      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.value = 523; // Do5
      osc2.frequency.value = 659; // Mi5

      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 3.5);

      osc1.connect(gain); osc2.connect(gain);
      gain.connect(audioCtx.destination);
      gain.connect(convolver);
      convolver.connect(rvGain);
      rvGain.connect(audioCtx.destination);

      osc1.start(t); osc1.stop(t + 3.6);
      osc2.start(t); osc2.stop(t + 3.6);
    }, i * 1800);
  }
}

// ── Activar/Desactivar ambiente
function startAmbience() {
  if (!audioCtx) return;
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 2);
  master.connect(audioCtx.destination);
  ambienceNodes.push(master);

  createWind(master);
  createCrowdMurmur(master);
  scheduleBird();
  scheduleBell();
}

function stopAmbience() {
  clearTimeout(bellTimeout);
  ambienceNodes.forEach(n => {
    try { if (n.stop) n.stop(); n.disconnect(); } catch(e) {}
  });
  ambienceNodes = [];
}

function toggleAmbience() {
  initAudio();
  const btn = document.getElementById('music-btn');
  if (ambiencePlaying) {
    stopAmbience();
    ambiencePlaying = false;
    btn.classList.remove('playing');
    btn.innerHTML = '♪';
    btn.title = 'Activar sonido ambiente';
  } else {
    ambiencePlaying = true;
    startAmbience();
    btn.classList.add('playing');
    btn.innerHTML = '♬';
    btn.title = 'Silenciar sonido ambiente';
  }
}

// ── TOOLTIP
function showTooltip(e, loc) {
  document.getElementById('tt-type').textContent = loc.label;
  document.getElementById('tt-name').textContent = loc.name;
  document.getElementById('tt-desc').textContent = loc.short;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const tw = 290, th = 100;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + tw > window.innerWidth) x = e.clientX - tw - 16;
  if (y + th > window.innerHeight) y = e.clientY - th - 16;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() { tooltip.classList.remove('visible'); }

// ── PANEL
function openPanel(loc) {
  document.getElementById('p-type').textContent = loc.label;
  document.getElementById('p-name').textContent = loc.name;
  let html = '';
  html += `<div class="panel-section"><div class="panel-section-title">Descripción</div><p>${loc.desc}</p></div>`;
  if (loc.stats) {
    html += `<div class="panel-section"><div class="panel-section-title">Datos</div><div class="stat-grid">`;
    Object.entries(loc.stats).forEach(([k, v]) => {
      html += `<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-value">${v}</div></div>`;
    });
    html += `</div></div>`;
  }
  if (loc.lore) html += `<div class="panel-section"><div class="panel-section-title">Crónicas</div><div class="lore-quote">${loc.lore}</div></div>`;
  if (loc.places && loc.places.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Lugares de Interés</div>`;
    loc.places.forEach(p => { html += `<p style="padding:4px 0;border-bottom:1px solid rgba(201,168,76,0.08);">◆ <em>${p}</em></p>`; });
    html += `</div>`;
  }
  document.getElementById('p-body').innerHTML = html;
  panel.classList.add('open');
}

function closePanel() { panel.classList.remove('open'); }

// ── PAN & ZOOM
function applyTransform() {
  stage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

function fitMap() {
  scale = Math.min(window.innerWidth / 900, window.innerHeight / mapH) * 0.95;
  posX = (window.innerWidth - 900 * scale) / 2;
  posY = (window.innerHeight - mapH * scale) / 2;
  applyTransform();
}

function zoom(factor) {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const bx = (cx - posX) / scale, by = (cy - posY) / scale;
  scale = Math.max(0.3, Math.min(4, scale * factor));
  posX = cx - bx * scale; posY = cy - by * scale;
  applyTransform();
}

function resetView() { fitMap(); }

const wrap = document.getElementById('map-wrap');
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.hotspot')) return;
  isDragging = true;
  startX = e.clientX - posX; startY = e.clientY - posY;
  wrap.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  posX = e.clientX - startX; posY = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; wrap.style.cursor = 'crosshair'; });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const bx = (e.clientX - posX) / scale, by = (e.clientY - posY) / scale;
  scale = Math.max(0.3, Math.min(4, scale * factor));
  posX = e.clientX - bx * scale; posY = e.clientY - by * scale;
  applyTransform();
}, { passive: false });

let lastDist = 0;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    startX = e.touches[0].clientX - posX;
    startY = e.touches[0].clientY - posY;
  } else if (e.touches.length === 2) {
    lastDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
  }
}, { passive: true });

wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && !e.target.closest('.hotspot')) {
    posX = e.touches[0].clientX - startX;
    posY = e.touches[0].clientY - startY;
    applyTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const bx = (cx - posX) / scale, by = (cy - posY) / scale;
    scale = Math.max(0.3, Math.min(4, scale * (dist / lastDist)));
    posX = cx - bx * scale; posY = cy - by * scale;
    lastDist = dist;
    applyTransform();
  }
}, { passive: false });

window.addEventListener('resize', fitMap);
</script>
</body>
